name: fuzz

# Manual: fuzzes parse, parseLenient and parseOrNull for 10 minutes (ADR-0004). CI only
# replays the committed inputs; a new finding is committed under
# nepdate/src/test/resources/io/github/sanamhub/nepdate/ParseFuzzTestInputs/fuzz/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Fuzz for 10 minutes
        env:
          JAZZER_FUZZ: "1"
        run: ./gradlew --console=plain :nepdate:test --tests 'io.github.sanamhub.nepdate.ParseFuzzTest'
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: nepdate/src/test/resources/io/github/sanamhub/nepdate/ParseFuzzTestInputs/
