name: shared-sync

on:
  schedule:
    - cron: "15 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@94946acd87bf4775c481811c0cdd63a7aaef2c84 # main 2026-10-09
    with:
      regenerate: ./gradlew --console=plain :codegen:run
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
