# The default rules, plus these changes. Each one needs a reason.
style:
  MagicNumber:
    # Calendar code is made of the spec's numbers (month lengths, epoch offsets, the multiply-shift
    # constants of ADR-0002 section 3); naming each one would hide where it comes from.
    active: false
  MaxLineLength:
    # Same limit as ktlint's official code style, so the two tools agree.
    maxLineLength: 140
complexity:
  TooManyFunctions:
    # docs/API.md fixes NepaliDate's surface at about 30 members, mirroring java.time.LocalDate.
    allowedFunctionsPerClass: 40
    allowedFunctionsPerObject: 20
