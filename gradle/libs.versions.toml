[versions]
kotlin = "2.4.20"
ktlint-plugin = "14.2.0"
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
maven-publish = "0.37.0"
dokka = "2.2.0"
junit = "5.14.4"
jqwik = "1.10.1"
jazzer = "0.30.0"
kotlinx-benchmark = "0.5.0"
kotlinx-serialization = "1.11.0"
animalsniffer = "2.0.1"
android-api-21 = "5.0.1_r2"
jmh = "1.37"
pitestVersion = "1.30.1"
pitestGradleVersion = "1.19.0"
pitestJunit5Version = "1.2.3"
shivathapaa = "3.3.0"
adbs = "v4.0.0"
aagitoex = "0.0.1-beta01"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
animalsniffer-android-signature = { module = "net.sf.androidscents.signature:android-api-level-21", version.ref = "android-api-21" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
nepali-date-picker-core = { module = "io.github.shivathapaa:nepali-date-picker-core", version.ref = "shivathapaa" }
adbs-core = { module = "com.github.dhiraj-var.adbs:adbs-core", version.ref = "adbs" }
aagitoex-nepdate = { module = "io.github.aagitoex:nepdate", version.ref = "aagitoex" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }
allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestGradleVersion" }
