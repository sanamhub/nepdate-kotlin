# jqwik: seeds are fixed in each @Property (jqwik has no global seed setting).
jqwik.seeds.whenfixed = ALLOW
jqwik.database = build/jqwik-database

# The suite is many small classes that only read the shared tables, so classes run in parallel.
# A class's methods stay on one thread, so a test that reads or writes global state cannot race
# another method of the same class.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
